apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit
  namespace: default
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/instance: fluent-bit
    app.kubernetes.io/version: 5.0.6

data:

  fluent-bit.conf: |
    [SERVICE]
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Daemon Off
        Flush 1
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf

    # ---------------- INPUT ----------------
    [INPUT]
        Name tail
        Path /var/log/containers/*ingress-nginx*.log
        Tag kube.ingress
        multiline.parser cri
        Mem_Buf_Limit 20MB
        Skip_Long_Lines On

    # ---------------- KUBERNETES METADATA ----------------
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log On
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

    # ---------------- PARSE NGINX ACCESS LOG ----------------
    [FILTER]
        Name parser
        Match kube.ingress
        Key_Name log
        Parser ingress_nginx
        Reserve_Data On
        Preserve_Key On

    # ---------------- OUTPUT TO SYSLOG ----------------
    [OUTPUT]
        Name syslog
        Match kube.ingress
        Host 10.123.1.4
        Port 514
        Mode udp
        Syslog_Format rfc5424
        Syslog_Appname_Preset ingress-nginx
        Syslog_Message_Key log

  # ---------------- PARSERS ----------------
  custom_parsers.conf: |
    [PARSER]
        Name docker_no_time
        Format json
        Time_Keep Off
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%L

    [PARSER]
        Name ingress_nginx
        Format regex
        Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) [^ ]* (?<client_ip>[^ ]*) - (?<user>[^ ]*) \[(?<req_time>[^\]]*)\] "(?<method>\S+) (?<uri>\S+) (?<protocol>[^"]+)" (?<status>\d{3}) (?<size>\d+).*
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
