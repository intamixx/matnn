apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit
  namespace: default

data:

  fluent-bit.conf: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info

        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020

        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf

    # ---------------- INPUT ----------------
    [INPUT]
        Name tail
        Path /var/log/containers/*ingress-nginx*.log
        Tag kube.ingress
        multiline.parser cri
        Mem_Buf_Limit 20MB
        Skip_Long_Lines On

    # ---------------- CRI UNWRAP ----------------
    [FILTER]
        Name parser
        Match kube.ingress
        Key_Name log
        Parser cri_json
        Reserve_Data On

    # ---------------- JSON PARSE ----------------
    [FILTER]
        Name parser
        Match kube.ingress
        Key_Name log
        Parser ingress_json
        Reserve_Data On

    # ---------------- DEBUG OUTPUT ----------------
    [OUTPUT]
        Name stdout
        Match kube.ingress
        Format json_lines

    # ---------------- SYSLOG OUTPUT (NO CUSTOM FIELD) ----------------
    [OUTPUT]
        Name syslog
        Match kube.ingress
        Host 10.123.1.4
        Port 514
        Mode udp
        Syslog_Format rfc5424
        Syslog_Appname_Preset ingress-nginx
        Syslog_Message_Key request

  custom_parsers.conf: |

    [PARSER]
        Name cri_json
        Format regex
        Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$

    [PARSER]
        Name ingress_json
        Format json
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S%z
