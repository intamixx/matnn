apiVersion: v1
kind: ServiceAccount
metadata:
  name: matnn-jobset-submitter
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: matnn-jobset-submitter
  namespace: default
rules:
  - apiGroups:
      - jobset.x-k8s.io
    resources:
      - jobsets
    verbs:
      - create
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: matnn-jobset-submitter
  namespace: default
subjects:
  - kind: ServiceAccount
    name: matnn-jobset-submitter
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: matnn-jobset-submitter
